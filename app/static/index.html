const L2C = {"a":"а","b":"б","d":"д","e":"е","f":"ф","g":"г","h":"ҳ","i":"и","j":"ж","k":"к","l":"л","m":"м","n":"н","o":"о","p":"п","q":"қ","r":"р","s":"с","t":"т","u":"у","v":"в","x":"х","y":"й","z":"з"};
const toCyr = s => s.replace(/oʻ|o‘/gi,"ў").replace(/gʻ|g‘/gi,"ғ").replace(/sh/gi,"ш").replace(/ch/gi,"ч").replace(/ya/gi,"я").replace(/yo/gi,"ё").replace(/yu/gi,"ю").replace(/[a-z]/gi,c=>{const r=L2C[c.toLowerCase()]||c;return c===c.toUpperCase()?r.toUpperCase():r});
let lang = (()=>{try{return localStorage.getItem("uzex_lang")}catch(e){return null}})() || ((navigator.language||"").startsWith("uz")?"uz":"ru");
let history = [], busy = false, stats = null, tape = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nf = (n, d=2) => Number(n).toLocaleString("ru-RU", {maximumFractionDigits: d});
const short = n => { const a = Math.abs(n), s = T[lang].short;
  if(a >= 1e12) return nf(n/1e12, 2)+" "+s[3]; if(a >= 1e9) return nf(n/1e9, 2)+" "+s[2];
  if(a >= 1e6) return nf(n/1e6, 2)+" "+s[1]; if(a >= 1e4) return nf(n/1e3, 1)+" "+s[0]; return nf(n, 2); };
function apply(){
  const t = T[lang];
  document.documentElement.lang = lang === "ru" ? "ru" : "uz";
  try{localStorage.setItem("uzex_lang", lang)}catch(e){}
  document.title = t.brand;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t[el.dataset.t]);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.l === lang));
  $("#q").placeholder = matchMedia("(max-width:620px)").matches ? t.phS : t.ph;
  $("#cards").innerHTML = t.cards.map(([ic,cat,q]) => `<button class="card${ic==="no"?" no":""}" type="button" data-q="${esc(q)}"><i>${IC[ic]}</i><span><small>${esc(cat)}</small><div>${esc(q)}</div></span></button>`).join("");
  document.querySelectorAll(".card").forEach(b => b.onclick = () => ask(b.dataset.q));
  renderStats(); renderTape();
}
function renderStats(){
  if(!stats) return; const t = T[lang];
  $("#stats").innerHTML = t.st.map(([k,l]) => `<span><b>${nf(stats[k])}</b> ${esc(l)}</span>`).join("") + `<span>${t.stPeriod}</span>`;
}
function renderTape(){
  if(!tape.length) return; const t = T[lang];
  const items = tape.map(x => {
    const name = lang==="ru" ? x.family : (lang==="uz" ? x.family_uz : toCyr(x.family_uz));
    return `<span class="ti"><b>${esc(name)}${x.brand?" "+esc(x.brand):""}</b><em>${nf(x.price)} ${t.cur[x.currency]}/${t.unit[x.unit]||x.unit}</em><span>${esc(lang==="uzc"?toCyr(x.region):x.region)}</span></span>`;
  }).join("");
  $("#track").innerHTML = items + items;
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { lang = b.dataset.l; apply(); });
$("#reset").onclick = () => { if(busy) return; history = []; $("#chat").innerHTML = ""; $("#hello").hidden = false; $("#reset").hidden = true; window.scrollTo({top:0}); $("#q").focus(); };
fetch("/api/stats").then(r=>r.json()).then(d=>{stats=d; renderStats();}).catch(()=>{});
fetch("/api/tape").then(r=>r.json()).then(d=>{tape=d; renderTape();}).catch(()=>{});
function pickChart(steps){
  const cands = steps.filter(s => s.tool==="run_sql" && s.result && s.result.columns && s.result.rows.length>=3 && s.result.rows.length<=20);
  for(const s of cands.reverse()){
    const {columns, rows} = s.result;
    const isNum = i => rows.every(r => typeof r[i] === "number" || r[i] === null);
    const timeCol = i => /^(year|month|quarter|y|m|q|yil|oy|chorak)$/i.test(columns[i]);
    const labelIdx = columns.map((c,i)=>i).filter(i => (!isNum(i) || timeCol(i)) && !/inn|_code$|_id$/i.test(columns[i]));
    const numIdx = columns.map((c,i)=>i).filter(i => isNum(i) && !timeCol(i) && !/inn|_id$|code|rank|^#$|pct|share|percent/i.test(columns[i]));
    if(!labelIdx.length || !numIdx.length) continue;
    const pref = numIdx.find(i => /uzs|sum|amount|total|turnover|summa/i.test(columns[i])) ?? numIdx.find(i => /price|vol|qty|^n$|cnt|count|deals/i.test(columns[i])) ?? numIdx[numIdx.length-1];
    const data = rows.map(r => [labelIdx.slice(0,2).map(i => r[i]).filter(v => v!==null && v!=="").join(" · "), r[pref]]).filter(d => typeof d[1]==="number" && d[0]);
    const labels = new Set(data.map(d=>d[0]));
    if(data.length < 3 || labels.size < data.length || data.every(d => d[1]===data[0][1]) || data.some(d => d[1] < 0)) continue;
    return {data, col: columns[pref]};
  }
  return null;
}
function chartHtml(c){
  const max = Math.max(...c.data.map(d=>d[1])), t = T[lang];
  return `<div class="chart"><h5>${t.chart}</h5>${c.data.map((d,i)=>`<div class="row"><span class="l" title="${esc(d[0])}">${esc(d[0])}</span><span class="b" style="width:${Math.max(2,d[1]/max*100)}%;animation-delay:${i*40}ms"></span><span class="v">${short(d[1])}</span></div>`).join("")}</div>`;
}
function resultTable(res){
  if(!res || !res.columns) return "";
  return `<div class="rt"><table><tr>${res.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${res.rows.slice(0,12).map(r=>`<tr>${r.map(v=>`<td>${esc(typeof v==="number"?nf(v,4):v)}</td>`).join("")}</tr>`).join("")}</table><small>${res.row_count}${res.truncated?"+":""} ${T[lang].s.rows}, ${res.ms??0} ms</small></div>`;
}
function stepHtml(s, i){
  const t = T[lang];
  if(s.tool === "run_sql") return `<div class="q"><h4>${i}. SQL${s.input.purpose?` <span>${esc(s.input.purpose)}</span>`:""}</h4><pre>${esc(s.input.sql)}</pre>${s.result?.error?`<p class="err">${esc(s.result.error)}</p>`:resultTable(s.result)}</div>`;
  const m = (s.result?.matches||[]).slice(0,5).map(x => esc(x.name||x.product_base) + (x.inn?`, ${x.inn}`:"") + (x.broker_code?`, ${x.broker_code}`:"")).join("\n");
  return `<div class="q"><h4>${i}. ${t.s.search} <span>${t.kinds[s.input.kind]||""}: «${esc(s.input.query)}»</span></h4><pre>${m||"—"}</pre></div>`;
}
const stripFollow = s => s.replace(/\n*\s*FOLLOWUPS:[\s\S]*$/, "");
async function ask(question){
  question = (question||"").trim(); if(!question || busy) return;
  busy = true; $("#send").disabled = true;
  document.querySelectorAll(".sugg").forEach(e => e.remove());
  $("#hello").hidden = true; $("#reset").hidden = false;
  const t = T[lang], chat = $("#chat");
  chat.insertAdjacentHTML("beforeend", `<div class="msg me"><div class="bub">${esc(question)}</div></div>`);
  const wrap = document.createElement("div"); wrap.className = "msg";
  wrap.innerHTML = `<div class="ava" aria-hidden="true">${IC.logo}</div><div class="ans"><ul class="steps"><li><span class="st"><i class="spin"></i></span><span>${t.s.search}…</span></li></ul><div class="md"></div></div>`;
  chat.appendChild(wrap); wrap.scrollIntoView({behavior:"smooth", block:"end"});
  const ans = wrap.querySelector(".ans"), md = wrap.querySelector(".md"), ul = wrap.querySelector(".steps");
  let text = "", steps = [], done = null, first = true, cur = ul.firstElementChild;
  const addStep = label => { const li = document.createElement("li"); li.innerHTML = `<span class="st"><i class="spin"></i></span><span>${esc(label)}…</span>`; ul.appendChild(li); return li; };
  const finish = (li, label) => { li.className = "done"; li.innerHTML = `<span class="st">${IC.ok}</span><span>${esc(label)}</span>`; };
  const draw = () => { md.innerHTML = DOMPurify.sanitize(marked.parse(stripFollow(text))); };
  try{
    const r = await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question, history, lang})});
    if(r.status === 429) throw new Error(t.rate);
    if(!r.ok) throw new Error(t.fail);
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for(;;){
      const {value, done: end} = await reader.read(); if(end) break;
      buf += dec.decode(value, {stream:true});
      let k; while((k = buf.indexOf("\n\n")) >= 0){
        const line = buf.slice(0, k); buf = buf.slice(k+2);
        if(!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if(ev.type === "step"){
          const label = ev.tool === "run_sql" ? (ev.input.purpose || t.s.sql) : `${t.s.search}: «${ev.input.query}»`;
          if(first){ cur.lastElementChild.textContent = label + "…"; first = false; } else cur = addStep(label);
          steps.push({tool:ev.tool, input:ev.input, li:cur, label});
        } else if(ev.type === "step_result"){
          const s = steps[steps.length-1]; s.result = ev.result; let label = s.label;
          if(s.tool === "search_entities"){ const m = ev.result.matches?.[0]; if(m) label = `${t.s.found}: ${m.product_family || m.name}`; }
          else if(ev.result.row_count !== undefined) label = `${s.label} (${ev.result.row_count} ${t.s.rows})`;
          finish(s.li, label);
        } else if(ev.type === "text"){ text += ev.text; draw(); }
        else if(ev.type === "reset"){ text = ""; draw(); }
        else if(ev.type === "done"){ done = ev; text = ev.answer || text; draw(); }
        else if(ev.type === "error"){ throw new Error(t.fail); }
      }
    }
    if(!stripFollow(text).trim()) throw new Error(t.fail);
    ul.querySelectorAll("li:not(.done)").forEach(li => li.remove());
    if(!ul.children.length) ul.remove(); else ul.classList.add("fin");
    const c = pickChart(steps); if(c) md.insertAdjacentHTML("beforeend", chartHtml(c));
    const nq = steps.filter(s => s.tool === "run_sql" && !s.result?.error).length;
    const tools = document.createElement("div"); tools.className = "tools";
    tools.innerHTML = (nq ? `<span class="seal">${IC.ok}${t.verified(nq)}</span>` : "") + `<span>${String(done?.seconds ?? "").replace(".", ",")} ${t.sec}</span><span class="grow"></span>` +
      (steps.length ? `<button class="tbtn" data-a="how">${IC.code}<span>${t.how}</span></button>` : "") + `<button class="tbtn" data-a="copy">${IC.copy}<span>${t.copy}</span></button>`;
    ans.appendChild(tools);
    const app = document.createElement("div"); app.className = "appendix"; app.hidden = true;
    app.innerHTML = steps.map((s,i) => stepHtml(s, i+1)).join(""); ans.appendChild(app);
    const how = tools.querySelector('[data-a=how]');
    if(how) how.onclick = () => { app.hidden = !app.hidden; how.lastElementChild.textContent = app.hidden ? t.how : t.hide; };
    const cp = tools.querySelector('[data-a=copy]');
    cp.onclick = async () => { try{ await navigator.clipboard.writeText(stripFollow(text)); cp.lastElementChild.textContent = t.copied; setTimeout(()=>cp.lastElementChild.textContent = t.copy, 1600);}catch(e){} };
    if(done?.followups?.length){
      const sg = document.createElement("div"); sg.className = "sugg"; sg.setAttribute("aria-label", t.more);
      sg.innerHTML = done.followups.map(f => `<button type="button">${esc(f)}</button>`).join("");
      sg.querySelectorAll("button").forEach(b => b.onclick = () => ask(b.textContent));
      chat.appendChild(sg);
    }
    history.push({role:"user", content:question}, {role:"assistant", content:stripFollow(text)});
  }catch(e){
    ul.remove(); ans.classList.add("bad"); md.innerHTML = `<p>${esc(e.message)}</p>`;
  }finally{
    busy = false; $("#send").disabled = false;
    if(matchMedia("(hover:hover)").matches) $("#q").focus();
  }
}
const q = $("#q");
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; });
q.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#form").requestSubmit(); } });
$("#form").onsubmit = e => { e.preventDefault(); const v = q.value; q.value = ""; q.style.height = "auto"; ask(v); };
marked.setOptions({breaks:true});
apply();
</script>
